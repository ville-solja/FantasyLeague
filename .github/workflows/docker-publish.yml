name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      # The Twitch extension package carries the backend origins its panel may call
      # (issue #164). They belong to the deployment, not to the code, so they come
      # from the repository variable EBS_ORIGINS (space-separated https origins,
      # e.g. "https://fantasy.example.org"). Without it the package is skipped and
      # the Docker image is still built.
      - name: Package Twitch extension
        if: ${{ vars.EBS_ORIGINS != '' }}
        env:
          EBS_ORIGINS: ${{ vars.EBS_ORIGINS }}
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          ORIGIN_ARGS=()
          for origin in $EBS_ORIGINS; do ORIGIN_ARGS+=(--ebs-origin "$origin"); done
          bash twitch-extension/package.sh "$VERSION" "${ORIGIN_ARGS[@]}"

      - name: Skip Twitch extension package
        if: ${{ vars.EBS_ORIGINS == '' }}
        run: echo "::notice::Twitch extension not packaged - set the repository variable EBS_ORIGINS to the backend origin(s) its panel may call."

      - name: Upload extension package
        if: ${{ vars.EBS_ORIGINS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: twitch-extension-${{ github.sha }}
          path: twitch-extension/twitch-extension-*.zip
          retention-days: 90

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Resolve version label
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "label=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "label=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.label }}
