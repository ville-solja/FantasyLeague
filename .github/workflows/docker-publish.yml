name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Package Twitch extension
        env:
          # Backend origins baked into the panel's ebs-origins.js (issue #164); the
          # panel refuses any other EBS URL. Override with the repository variable
          # EBS_ORIGINS (space-separated https origins, e.g. to add a test host).
          EBS_ORIGINS: ${{ vars.EBS_ORIGINS || 'https://kana-cards.com' }}
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          ORIGIN_ARGS=()
          for origin in $EBS_ORIGINS; do ORIGIN_ARGS+=(--ebs-origin "$origin"); done
          bash twitch-extension/package.sh "$VERSION" "${ORIGIN_ARGS[@]}"

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: twitch-extension-${{ github.sha }}
          path: twitch-extension/twitch-extension-*.zip
          retention-days: 90

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Resolve version label
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "label=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "label=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.label }}
