name: Unit Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  # Pushes to main run these tests from docker-publish.yml, which builds the image only
  # after they pass.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.3.1

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.lock --require-hashes

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --require-hashes

      - name: Run pytest (root tests)
        run: python -m pytest tests/ --ignore=tests/ui -v --tb=short

      - name: Run pytest (backend suite)
        working-directory: backend
        run: python -m pytest tests/ -n auto -q --tb=short
