services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-local/dota-kanaliiga-fantasy}:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./twitch-extension:/app/twitch-extension
    # Matches backend/Dockerfile's own HEALTHCHECK — kept explicit here too since
    # Compose's healthcheck: overrides the image's HEALTHCHECK when both are set.
    # Python-based, not curl: curl is not installed in this image.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Pass through vars from repo .env (Compose interpolation often misses them on Windows).
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OPENDOTA_API_KEY=${OPENDOTA_API_KEY:-}
      - INGEST_POLL_INTERVAL=${INGEST_POLL_INTERVAL:-900}
      - TOORNAMENT_CLIENT_ID=${TOORNAMENT_CLIENT_ID:-}
      - TOORNAMENT_CLIENT_SECRET=${TOORNAMENT_CLIENT_SECRET:-}
      - TOORNAMENT_API_KEY=${TOORNAMENT_API_KEY:-}
      - TOORNAMENT_TOURNAMENT_ID=${TOORNAMENT_TOURNAMENT_ID:-}

